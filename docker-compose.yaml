version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: shareit-db
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: shareit
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data: